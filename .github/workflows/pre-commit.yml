name: Pre-commit Check

on:
  pull_request:
    types: [ready_for_review]
    branches:
      - master
      - beta
      - rc

jobs:
  pre-commit:
    runs-on: windows-latest
    if: "!contains(github.event.pull_request.labels.*.name, 'skip-precommit')"
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install pre-commit
        run: pip install pre-commit

      - name: Run pre-commit hooks on changed files
        run: |
            # Fetch the base branch
            git fetch origin ${{ github.base_ref }}
            # List changed files, filter out deleted files, and run pre-commit on them.
            git diff --name-only --diff-filter=d origin/${{ github.base_ref }} \
            | xargs pre-commit run --files

      - name: Commit and push changes from pre-commit
        run: |
            git config --global user.name 'github-actions[bot]'
            git config --global user.email 'github-actions[bot]@users.noreply.github.com'
            git add .
            # Don't run pre-commit again on the commit
            git commit -m "Apply pre-commit fixes" || echo "No changes to commit" --no-verify
            git push

      - name: Check for remaining issues
        run: |
            # List changed files, filter out deleted files, and run pre-commit on them.
            # Exit with error if pre-commit fails.
            git diff --name-only --diff-filter=d origin/${{ github.base_ref }} \
            | xargs pre-commit run --files || exit 1
